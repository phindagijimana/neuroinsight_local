<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' http://127.0.0.1:* http://localhost:*" />
  <title>NeuroInsight-AutoHS</title>
  <link rel="stylesheet" href="setup.css" />
</head>
<body>
  <div class="splash">
    <header class="brand">
      <div class="brand-mark" aria-hidden="true">NI</div>
      <div>
        <h1>NeuroInsight-AutoHS</h1>
        <p class="version" id="version"></p>
      </div>
    </header>

    <section id="state-loading" class="panel">
      <div class="spinner" aria-hidden="true"></div>
      <p class="status" id="status-message">Starting…</p>
    </section>

    <section id="state-blocked" class="panel hidden">
      <h2 id="blocked-title">Setup needed</h2>
      <p class="blocked-message" id="blocked-message"></p>
      <div class="actions" id="blocked-actions">
        <button type="button" id="btn-license" class="primary hidden">Choose license.txt…</button>
        <button type="button" id="btn-docker" class="secondary hidden">Get Docker Desktop</button>
        <button type="button" id="btn-retry" class="primary">Try again</button>
      </div>
    </section>

    <details id="details-panel" class="details hidden">
      <summary>Technical details</summary>
      <ol id="steps" class="steps"></ol>
      <pre id="log" class="log"></pre>
    </details>
  </div>
  <script src="setup.js"></script>
</body>
</html>
