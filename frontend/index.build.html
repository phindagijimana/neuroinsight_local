    /* Form focus and accent colors */
    input:focus, select:focus, textarea:focus {
      --tw-ring-color: rgb(0 61 122 / var(--tw-ring-opacity)) !important;
      --tw-border-color: rgb(0 61 122 / var(--tw-border-opacity)) !important;
    }

    /* Force dropdown colors */
    select[value*="coronal"], select[value*="axial"],
    .force-blue-colors {
      color: #003d7a !important;
      border-color: #003d7a !important;
      border: 1px solid #003d7a !important;
      background-color: #f8fafc !important;
    }

    /* Override focus ring colors for orientation select */
    #orientation-select:focus {
      --tw-ring-color: rgb(0 61 122 / var(--tw-ring-opacity)) !important;
      box-shadow: 0 0 0 2px rgb(0 61 122 / 0.2) !important;
    }

    /* Range slider accent color */
    input[type="range"]::-webkit-slider-thumb {
      accent-color: #003d7a !important;
    }
    input[type="range"]::-moz-range-thumb {
      accent-color: #003d7a !important;
    }
  </style>
  <style>
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .animate-spin {
      animation: spin 1s linear infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    .animate-pulse {
      animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
  </style>
